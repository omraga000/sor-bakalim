<!DOCTYPE html>
<html lang="tr" class="game-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sor Bakalım - Oyun Alanı</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!-- Supabase JS CDN (v2) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="game-body">

  <div id="loadingScreen" class="loading-overlay">
    <div class="loader-content">
      <div class="spinner"></div>
      <h2>Sor Bakalım Hazırlanıyor...</h2>
      <p>Sorular yükleniyor, stüdyo hazırlanıyor!</p>
    </div>
  </div>

  <header class="game-topbar">
    <div class="topbar-left">
      <button class="control-btn" onclick="location.href='oyunlarim.html'">Oyunlarım</button>
      <button class="control-btn finish-btn" onclick="finishGame()">Oyunu Bitir</button>
    </div>
    <div class="topbar-center">
      <a href="index.html" class="logo-nav-link" title="Ana Sayfaya Dön"><img src="img/logo.png" alt="Sor Bakalım" class="topbar-logo-img"><span class="game-room-title" id="roomTitle">Sor Bakalım - Özel Maç</span></a>
    </div>
    <div class="topbar-right">
      <div class="turn-badge" id="currentTurnBadge">Sıra: Birinci Takım</div>
    </div>
  </header>

  <main class="game-main-container">
    <div class="board-grid" id="boardGrid"></div>
  </main>

  <footer class="game-footer-bar">
    <div class="team-panel team-one">
      <div class="team-info">
        <span class="team-name" id="displayTeam1">Birinci Takım</span>
        <div class="score-box">
          <button class="score-btn minus" onclick="adjust(0, -100)">-</button>
          <span class="score-value" id="score1">0</span>
          <button class="score-btn plus" onclick="adjust(0, 100)">+</button>
        </div>
      </div>
      <div class="lifelines-bar" id="lifes1"></div>
    </div>

    <div class="game-status-msg" id="gameStatusMsg">
      Bir kategori ve puan seçerek yarışmayı başlatın!
    </div>

    <div class="team-panel team-two">
      <div class="lifelines-bar" id="lifes2"></div>
      <div class="team-info">
        <span class="team-name" id="displayTeam2">İkinci Takım</span>
        <div class="score-box">
          <button class="score-btn minus" onclick="adjust(1, -100)">-</button>
          <span class="score-value" id="score2">0</span>
          <button class="score-btn plus" onclick="adjust(1, 100)">+</button>
        </div>
      </div>
    </div>
  </footer>

  <div id="questionModal" class="modal-overlay" style="display: none;">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <script src="js/questions.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
